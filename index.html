<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PubPay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Same visual system as PubPub and TermFlow (CPECMU tools): lavender-blue gradient header with a gold rule,
   numbered section heads, white rounded panels, gradient KPI cards, gold-edged insight notes. */
:root{--bg:#f6f5fb;--surface:#ffffff;--surface-2:#faf9fd;--border:#e8e6f1;--text:#2a2c3d;--text-2:#565a70;--muted:#767b92;
--header-bg:#ebe4f8;--header-bg-2:#dfeaf8;--header-text:#2e2a4a;--header-muted:#615d7e;--nav-border:rgba(46,42,74,.18);--nav-hover:rgba(46,42,74,.07);
--purple-soft:#f2edfa;--gold:#f2d58a;--gold-ink:#1d1600;--brand:#7354b3;--accent:#8566c2;--link:#6b4fa8;--focus:#e5b94a;--on-accent:#ffffff;
--k1:linear-gradient(135deg,#e2e8fc,#ccd7f6);--k2:linear-gradient(135deg,#eee3fa,#dccbf3);--k5:linear-gradient(135deg,#fcf1cf,#f5e2a8);--k3:linear-gradient(135deg,#dcf1ea,#c2e5da);
--kpi-text:#2a2c3d;--kpi-ico:rgba(255,255,255,.6);--kpi-glow:rgba(255,255,255,.3);
--banner-bg:#fdf4dc;--banner-text:#5a4300;
--shadow:0 1px 2px rgba(42,44,61,.04),0 4px 14px rgba(42,44,61,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14172a;--surface:#1c2036;--surface-2:#22273f;--border:#323955;--text:#ebedf6;--text-2:#c3c7da;--muted:#9ba2bd;
--header-bg:#26213f;--header-bg-2:#1e2a46;--header-text:#eeebf9;--header-muted:#b7b3d1;--nav-border:rgba(255,255,255,.22);--nav-hover:rgba(255,255,255,.1);
--purple-soft:#2b2645;--gold:#e6cc85;--brand:#e6cc85;--accent:#c2adef;--link:#cdbaf5;--on-accent:#1b1d2b;
--k1:linear-gradient(135deg,#343e66,#434f80);--k2:linear-gradient(135deg,#3d3465,#52447d);--k5:linear-gradient(135deg,#4e4523,#64582d);--k3:linear-gradient(135deg,#23463d,#2d5a4e);
--kpi-text:#f1effa;--kpi-ico:rgba(255,255,255,.12);--kpi-glow:rgba(255,255,255,.06);--banner-bg:#3a3214;--banner-text:#f3dc95;
--shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.22);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14172a;--surface:#1c2036;--surface-2:#22273f;--border:#323955;--text:#ebedf6;--text-2:#c3c7da;--muted:#9ba2bd;
--header-bg:#26213f;--header-bg-2:#1e2a46;--header-text:#eeebf9;--header-muted:#b7b3d1;--nav-border:rgba(255,255,255,.22);--nav-hover:rgba(255,255,255,.1);
--purple-soft:#2b2645;--gold:#e6cc85;--brand:#e6cc85;--accent:#c2adef;--link:#cdbaf5;--on-accent:#1b1d2b;
--k1:linear-gradient(135deg,#343e66,#434f80);--k2:linear-gradient(135deg,#3d3465,#52447d);--k5:linear-gradient(135deg,#4e4523,#64582d);--k3:linear-gradient(135deg,#23463d,#2d5a4e);
--kpi-text:#f1effa;--kpi-ico:rgba(255,255,255,.12);--kpi-glow:rgba(255,255,255,.06);--banner-bg:#3a3214;--banner-text:#f3dc95;
--shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.22);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{text-size-adjust:100%;-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:12px}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "IBM Plex Sans Thai Looped",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai","Helvetica Neue",Arial,sans-serif;overflow-x:hidden}
a{color:var(--link)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
button,input,select{font:inherit}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
header.top{background:linear-gradient(100deg,var(--header-bg),var(--header-bg-2));color:var(--header-text);border-bottom:3px solid var(--gold)}
header.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding-block:14px}
.brand{flex:1 1 420px;min-width:0}
.brand h1{margin:0;font-size:22px;line-height:1.2;letter-spacing:.2px;font-weight:750}
.brand h1 .cmu{color:var(--brand)}
.brand h1 .expand{font-size:15px;font-weight:500;color:var(--header-muted);margin-left:6px;white-space:nowrap}
.brand h1 .expand b{color:var(--header-text);font-weight:700}
.brand .sub{margin:3px 0 0;color:var(--header-muted);font-size:13px}
.sec-nav{display:flex;gap:6px;flex-wrap:wrap;flex-basis:100%}
.sec-nav a{color:var(--header-text);text-decoration:none;font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid var(--nav-border)}
.sec-nav a:hover{background:var(--nav-hover)}
.controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.ctl-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-right:6px;font-weight:600}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:999px;padding:2px;background:var(--surface)}
.seg button{appearance:none;border:0;background:transparent;color:var(--text);font-size:13px;font-weight:600;padding:5px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink)}
.banner{background:var(--banner-bg);color:var(--banner-text);font-size:13px}
.banner .wrap{padding-block:7px}
.banner a{color:inherit}

/* sections */
main{padding-block:18px 8px}
section.sec{margin-bottom:26px}
section.sec+section.sec,#crit>section.sec{border-top:1px solid var(--border);padding-top:22px}
.sec-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin:6px 0 14px}
.sec-head h2{margin:0;font-size:22px;font-weight:750;display:flex;align-items:center;gap:10px;text-wrap:balance}
.sec-head .hint{color:var(--muted);font-size:13px;margin:0;flex-basis:100%}
.sec-no{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:14px;font-weight:700;flex:none}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:var(--shadow);min-width:0}
.panel h3{margin:0 0 2px;font-size:15px;font-weight:700}
.panel .hint{margin:0 0 12px;font-size:12px;color:var(--muted)}
.insight{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--gold);font-size:13.5px;color:var(--text-2)}
.insight b{color:var(--text)}
.insight p{margin:0}.insight ul{margin:0;padding-left:18px}.insight li+li{margin-top:4px}.insight p+p{margin-top:6px}
.insight.soft{background:var(--surface-2)}
.insight.idle{display:flex;align-items:center;justify-content:center;text-align:center;min-height:180px;margin-top:0;border:1px dashed var(--border);background:var(--surface-2);color:var(--muted);font-size:15px;font-weight:600;letter-spacing:.02em}.insight.idle p{margin:0}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
#crit .panel+.two,#crit .panel+.panel{margin-top:14px}

/* calculator */
.asof{margin:8px 0 0!important;font-size:12px;color:var(--muted)}
.notice{display:flex;gap:12px;align-items:flex-start;margin:0 0 14px;padding:12px 16px;border-radius:12px;background:var(--k5);border:1px solid var(--border);color:var(--text)}.notice p{margin:0;font-size:14px;line-height:1.6}.notice .ni{flex:none;display:grid;place-items:center;width:22px;height:22px;margin-top:1px;border-radius:50%;background:var(--gold-ink);color:var(--gold);font:700 13px/1 Georgia,serif;font-style:italic}
.calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:14px;align-items:start}
.adder{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:end;padding:12px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px}
.adder label,.field>label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em}
.adder select{width:100%;height:42px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);font-size:15px;padding:0 8px}
.add{height:42px;padding:0 18px;border:0;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:700;cursor:pointer;white-space:nowrap}
.add:disabled{opacity:.5;cursor:default}
.lh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:16px 0 6px}
.lh b{font-size:14px}
.clr{border:1px solid var(--border);background:var(--surface);color:var(--text-2);font-size:12.5px;font-weight:600;cursor:pointer;border-radius:999px;padding:4px 12px;min-height:30px}
.clr:hover:not(:disabled){background:var(--purple-soft)}.clr:disabled{opacity:.5;cursor:default}
.plist{list-style:none;margin:0;padding:0;border-top:1px solid var(--border);counter-reset:p}
.plist li{display:grid;grid-template-columns:24px minmax(0,1fr) 36px;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--border)}
.pm{display:grid;gap:6px;margin-top:8px}
.pm .r,.perp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;color:var(--kpi-text)}
.pm .top{background:var(--k3)}.pm .gr{background:var(--k5);grid-template-columns:minmax(0,1fr)}.pm .gr .choice{justify-content:flex-start}a.opt{color:var(--link);text-decoration:none;font-weight:600;display:inline-flex;align-items:center;min-height:32px}.perp .k small{display:block}a.opt:hover{background:var(--purple-soft)}.pm .uni{background:var(--k2)}.perp{background:var(--k1);margin-top:10px}
.pm .none{background:var(--surface-2);color:var(--muted);grid-template-columns:minmax(0,1fr)}
.pm .k,.perp .k{font-size:13px;font-weight:600}.pm .k small,.perp .k small{font-weight:400;color:inherit;opacity:.8}
.pm .amt,.perp .amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.choice{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.choice .opt{padding:3px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:12.5px;white-space:nowrap}
.plist .choice b{display:inline;font-weight:700}
.choice .or{font-size:12px;font-weight:700;color:inherit;text-transform:uppercase}
.plist li::before{counter-increment:p;content:counter(p);display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--purple-soft);color:var(--link);font-size:11.5px;font-weight:700}
.plist b{display:block;font-weight:600}.plist small{display:block;color:var(--muted);font-size:12.5px}
.plist:not(.dl) li{align-items:center}.plist.dl li{grid-template-columns:24px minmax(0,1fr)}.plist.dl:empty,.insight:empty{display:none}
.plist li.empty{display:block;color:var(--muted);padding:14px 0}.plist li.empty::before{content:none}
.x{width:36px;height:36px;border:1px solid var(--border);border-radius:50%;background:var(--surface);color:var(--muted);font-size:18px;line-height:1;cursor:pointer}
.x:hover{color:var(--link);background:var(--purple-soft)}
.field{margin-top:14px}
.money{display:flex;align-items:center;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
.money span{padding:0 12px;color:var(--muted);font-size:13px}
.money input{flex:1;min-width:0;height:44px;border:0;background:transparent;color:var(--text);font-size:16px;text-align:right;padding-right:10px;font-variant-numeric:tabular-nums;border-radius:10px}
.fhint{font-size:12px;color:var(--muted);margin-top:4px}

.vt{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.vt h3{margin:0}.vt span{font-size:12px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.kpi{position:relative;color:var(--kpi-text);border-radius:14px;padding:14px 14px 12px;min-height:104px;box-shadow:var(--shadow);overflow:hidden;display:flex;gap:10px;align-items:flex-start}
.kpi::after{content:"";position:absolute;right:-30px;bottom:-40px;width:120px;height:120px;border-radius:50%;background:var(--kpi-glow);pointer-events:none}
.kpi.k2{background:var(--k2)}.kpi.k1{background:var(--k1)}.kpi.k5{background:var(--k5)}.kpi.k3{background:var(--k3)}
.kpi .ico{flex:0 0 34px;width:34px;height:34px;border-radius:10px;background:var(--kpi-ico);display:grid;place-items:center}
.kpi .ico svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.kpi .body{min-width:0;flex:1}
.kpi .lbl{font-size:12px;font-weight:600;opacity:.92;text-transform:uppercase;letter-spacing:.05em}
.kpi .val{font-size:30px;font-weight:800;line-height:1.1;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .val.rng{font-size:22px;white-space:normal}
.kpi .val small{font-size:15px;font-weight:600;opacity:.9;margin-left:4px}
.kpi .meta{font-size:12px;opacity:.92;margin-top:3px}
.lines{margin:14px 0 0;padding:0;list-style:none;border-top:1px solid var(--border)}
.lines li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:9px 0;border-bottom:1px dashed var(--border)}
.lines li.off{color:var(--muted)}
.lines b{font-weight:600}.lines small{display:block;color:var(--muted);font-size:12.5px}
.amt{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700}
.acts{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.acts small{color:var(--muted);font-size:12.5px}
.btn{appearance:none;border:1px solid var(--border);background:var(--gold);color:var(--gold-ink);font-size:13px;font-weight:700;padding:7px 16px;border-radius:999px;cursor:pointer}
.btn:hover{filter:brightness(.97)}

/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--border);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;vertical-align:bottom}
tbody tr:hover{background:var(--surface-2)}
tr.gr td{font-weight:700;color:var(--link);background:var(--purple-soft)}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--purple-soft);color:var(--link);white-space:nowrap}
.tag.g{background:var(--banner-bg);color:var(--banner-text)}
.tag.m{background:var(--surface-2);color:var(--muted);border:1px solid var(--border);font-weight:600}
.sec-head h2 .tag{font-size:12px}
.plan{margin:0;padding-left:20px}.plan>li{margin-bottom:14px}.plan>li:last-child{margin-bottom:0}.plan .tw{margin-top:8px;max-width:460px}
.panel ul{margin:0;padding-left:18px}.panel li{margin-bottom:5px}
.panel p{margin:0 0 10px}
.refs{margin:0;padding-left:20px;color:var(--text-2)}.refs li{margin-bottom:4px}

.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.lk{display:grid;gap:2px;padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:14px;box-shadow:var(--shadow);text-decoration:none;color:var(--text)}
.lk:hover{background:var(--purple-soft)}
.lk-t{font-size:15px;font-weight:700}.lk-d{font-size:13px;color:var(--text-2)}.lk-h{font-size:12px;font-weight:600;color:var(--link);margin-top:4px}

/* footer */
footer{color:var(--muted);font-size:12px;padding-block:22px 28px}
footer .wrap{display:flex;flex-wrap:wrap;gap:4px 16px;justify-content:space-between}
footer .legal{flex-basis:100%;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);line-height:1.55}
footer .legal p{margin:0 0 8px;max-width:90ch}
footer b{color:var(--text)}

@media(max-width:900px){.calc,.two{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){.adder{grid-template-columns:minmax(0,1fr)}.add{width:100%}
.pm .r{grid-template-columns:minmax(0,1fr)}.choice{justify-content:flex-start}
.brand h1 .expand{display:block;margin:2px 0 0}
.stack thead{display:none}.stack tr{display:grid;padding-block:8px;border-bottom:1px solid var(--border)}.stack td{display:flex;justify-content:space-between;gap:12px;border:0;padding:3px 0;text-align:right}.stack td::before{content:attr(data-l);color:var(--muted);text-align:left}.stack tr.gr td{display:block;text-align:left;padding:6px 8px}.stack tr.gr td::before{content:none}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
<div class="brand">
<h1><span class="cmu">PubPay</span><span class="expand"><b>Pub</b>lication <b>Pay</b>out</span></h1>
<p class="sub" data-i="sub"></p>
</div>
<div class="controls"><span class="ctl-label" data-i="langL"></span>
<div class="seg" role="group" aria-label="Language"><button type="button" data-l="th" aria-pressed="true">ไทย</button><button type="button" data-l="en" aria-pressed="false">English</button></div></div>
<nav class="sec-nav" aria-label="Sections"><a href="#s1" data-i="n1"></a><a href="#s2" data-i="n2"></a><a href="#plan" data-i="nP"></a><a href="#s3" data-i="n3"></a></nav>
</div></header>

<main class="wrap">
<section class="sec" id="s1">
<div class="sec-head"><h2><span class="sec-no">1</span><span data-i="h1"></span></h2><p class="hint" data-i="h1h"></p></div>
<div class="notice" role="note"><span class="ni" aria-hidden="true">i</span><p data-i="notice"></p></div>
<div class="calc">
<div class="panel">
<h3 data-i="g1"></h3><p class="hint" data-i="g1h"></p>
<div class="adder">
<div><label for="nt" data-i="lType"></label><select id="nt"></select></div>
<button class="add" type="button" id="add" data-i="add"></button>
</div>
<div class="lh"><b id="lcount"></b><button class="clr" type="button" id="clr" data-i="clr"></button></div>
<ol class="plist" id="plist"></ol>
</div>

<div class="panel voucher" aria-live="polite">
<div class="vt"><h3 data-i="vt1"></h3><span data-i="vt2"></span></div>
<ol class="plist dl" id="dlist"></ol>
<div class="perp" id="perp" hidden></div>
<p class="asof" id="asof" data-i="asof" hidden></p>
<div class="insight" id="why"></div>
</div>
</div>
</section>
<div id="crit"></div>
</main>

<footer><div class="wrap">
<span><b>PubPay</b> · <a href="https://navadon.github.io/pubpay/" target="_blank" rel="noopener">navadon.github.io/pubpay</a></span>
<div class="legal" data-i="legal"></div>
</div></footer>

<script>
{
const ORA='https://ora.oou.cmu.ac.th/%E0%B8%9B%E0%B8%A3%E0%B8%B0%E0%B8%81%E0%B8%B2%E0%B8%A8%E0%B8%A1%E0%B8%AB%E0%B8%B2%E0%B8%A7%E0%B8%B4%E0%B8%97%E0%B8%A2%E0%B8%B2%E0%B8%A5%E0%B8%B1%E0%B8%A2%E0%B9%80%E0%B8%8A%E0%B8%B5%E0%B8%A2%E0%B8%87-8/';
const MIS='https://research.mis.cmu.ac.th';
const CORE='https://portal.core.edu.au/conf-ranks/';

const CAP2=10000,MAXP=20;
let P=[],lang='th';
try{const s=localStorage.getItem('cpe-lang');if(s==='en'||s==='th')lang=s}catch(_){}
const $=id=>document.getElementById(id);
const f=n=>n.toLocaleString('en-US',{maximumFractionDigits:2});
const isJ=t=>AMT[t][0]>0;
const t=()=>D[lang];

function applyLang(){
  const L=t();
  document.documentElement.lang=lang;document.title=L.title;
  document.querySelectorAll('[data-i]').forEach(el=>{const v=L[el.dataset.i];if(typeof v==='string')el.innerHTML=v});
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===lang));
  const cur=$('nt').value||'q1';
  $('nt').innerHTML=Object.keys(AMT).map(k=>`<option value="${k}"${k===cur?' selected':''}>${L.T[k]}</option>`).join('');
  $('crit').innerHTML=L.crit();
  list();
}

function list(){
  const L=t();
  $('lcount').textContent=L.list(P.length);
  $('plist').innerHTML=P.length?P.map((p,i)=>`<li><b>${L.T[p.t]}</b><button class="x" type="button" data-i-x="${i}" aria-label="${L.rm(i+1,L.T[p.t])}">×</button></li>`).join(''):`<li class="empty">${L.empty}</li>`;
  $('add').disabled=P.length>=MAXP;
  $('clr').disabled=!P.length;
  render();
}

function render(){
  const L=t(),B=' '+L.baht;
  const J=P.filter(p=>isJ(p.t)),nCf=P.filter(p=>p.t==='cf').length,n=P.length;
  const t1=J.reduce((a,p)=>a+AMT[p.t][0],0),fac=J.reduce((a,p)=>a+AMT[p.t][1],0);

  $('dlist').innerHTML=P.map(p=>{
    let rows;
    if(isJ(p.t)){
      const[a,fc]=AMT[p.t],u=UR[p.t][0];
      rows=`<div class="r top"><div class="k">${L.fR}<small>${fc?L.srcF(f(fc),f(a-fc)):L.srcD}</small></div><div class="amt">${f(a)}</div></div>`+
      `<div class="r uni"><div class="k">${L.pUni}<small>${L.pPick}</small></div><div class="choice"><span class="opt">${L.pRw} <b>${f(u)}</b></span><span class="or">${L.pOr}</span><span class="opt">${L.pApc} <b>${L.pAct}${p.t==='q1'?'':' ≤ 60,000'}</b></span></div></div>`;
    }else{const lk=(u,x)=>`<a class="opt" href="${u}" target="_blank" rel="noopener">${x} ↗</a>`;
      rows=`<div class="r gr"><div class="k">${L.pGr}</div><div class="choice">${lk(UNI,L.pGrU)}<span class="or">${L.pAnd}</span>${lk(FAC,L.pGrF)}</div></div>`;}
    return `<li><div><b>${L.T[p.t]}</b><div class="pm">${rows}</div></div></li>`;
  }).join('');
  $('perp').hidden=n===0;$('asof').hidden=n===0;
  $('perp').innerHTML=`<div class="k">${L.fS}<small>${L.pp}</small></div><div class="amt">≤ ${f(CAP2)}</div>`;

  const W=[];
  if(n===0)W.push(L.wNone);
  $('why').innerHTML=W.map(w=>`<p>${w}</p>`).join('');
  $('why').classList.toggle('idle',n===0);

}

document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{
  lang=b.dataset.l;try{localStorage.setItem('cpe-lang',lang)}catch(_){}applyLang();
}));
$('add').addEventListener('click',()=>{if(P.length<MAXP){P.push({t:$('nt').value});list()}});
$('plist').addEventListener('click',e=>{
  const b=e.target.closest('.x');if(!b)return;P.splice(+b.dataset.iX,1);list();
  (document.querySelector('.plist .x')||$('add')).focus();
});
$('clr').addEventListener('click',()=>{P=[];list();$('add').focus()});
applyLang();
}
